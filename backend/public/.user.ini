; Upload limits for this site (media audit, 2026-10-01).
;
; The app accepts photos up to 10 MB, library files up to 50 MB and clips up
; to 8 MB, and decodes pictures up to 25 megapixels. PHP's own limits decide
; what actually arrives; the host's defaults are often lower, and then an
; upload simply vanishes and the app says "the photo field is required".
; cPanel reads this file for PHP-FPM and LSAPI sites; it takes up to five
; minutes (user_ini.cache_ttl) to apply after a deploy.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
