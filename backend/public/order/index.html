    <!--
      Which build this device is actually running. Reported by /order/reset so
      a device that is still showing the wrong menu can be named by build
      rather than described. Replaced at build time (see vite.config.ts).

    <!--
      Runs before the app, and only on /order/reset or ?fresh=1 — clears this
      device's service workers and caches. External on purpose: the CSP above
      allows `script-src 'self'` and no inline script.
    -->
    <script src="/order/reset.js"></script>
