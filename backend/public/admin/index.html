<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bake & Grill — Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Keep in sync with backend SecurityHeaders middleware: browsers enforce the
         INTERSECTION of this meta CSP and the server header, and the /admin/ directory
         index can be served statically (bypassing Laravel), so this meta is load-bearing. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com https://*.ingest.sentry.io; worker-src 'self' blob:;" />
    <meta name="theme-color" content="#D4813A" />
    <!-- Tab and home-screen icons. These were one 1080px logo at the site
         root, which the dev server does not serve and which Safari will not
         shrink to a tab icon (owner, 2026-09-14: "no favicon in admin").
         Real sizes now, all under /admin/ so the SPA owns them. -->
    <link rel="icon" href="/admin/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/admin/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/admin/apple-touch-icon.png" />

    <!-- PWA manifest — the admin on a phone's home screen, launched
         full-screen, the way the POS is. The /admin/ scope keeps the
         install separate from the POS under /pos/. -->
    <link rel="manifest" href="/admin/manifest.webmanifest" />

    <!-- iOS standalone hints. Without these the home-screen icon opens a
         Safari shell with the URL bar, which reads as "the install did not
         work". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="B&G Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/dhivehi-font.css?app=website" />
    <script src="/admin/theme-init.js"></script>
    <style>
      /*
       * In the base layer, where Tailwind keeps its own copy of this reset.
       * Unlayered, it outranked every utility in @layer utilities, so the
       * shared Card's p-5, the Button's px-4 and every p-* / m-* class in the
       * app computed to zero — cards with text against their border, buttons
       * with none beside their label (owner's phone, 2026-09-17).
       */
      @layer base {
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      }
      body { font-family: var(--font-ui); background: #f1f5f9; color: #1e293b; }
      html[data-theme="dark"] body { background: #0F0D0A; color: #F0EAE0; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
    </style>
    <script type="module" crossorigin src="/admin/assets/index-BOjdpGZY.js"></script>
    <link rel="modulepreload" crossorigin href="/admin/assets/vendor-BWxBgI-I.js">
    <link rel="stylesheet" crossorigin href="/admin/assets/index-Btxdo5o6.css">
  <link rel="manifest" href="/admin/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
