name: CI
# ────────────────────────────────────────────────────────────────────────────
# This workflow runs on every push/PR to main.
#
# DEPLOY TARGET: The `deploy` job below deploys ONLY to the TEST server
#   (test.bakeandgrill.mv) — it is NOT a production deploy.
#
# When a separate production server (bakeandgrill.mv) is introduced, add a
# second `deploy-production` job using environment: production with its own
# DEPLOY_HOST_PROD / DEPLOY_USER_PROD / DEPLOY_SSH_KEY_PROD secrets.
# See MAIN_PRODUCTION_LAUNCH_TODO.md for the full production deploy checklist.
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in a PR, not just HEAD
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_FAIL_ON_LEAK: "true"

  lint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        working-directory: backend
        run: ./vendor/bin/pint --test

  test:
    name: PHPUnit tests
    runs-on: ubuntu-latest
    needs: lint

    services: {}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run tests
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --stop-on-failure

  test-postgres:
    name: PHPUnit tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bakegrill_test
          POSTGRES_USER: bakegrill
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      # Full suite (856 tests) on SQLite in the `test` job.
      # representative PostgreSQL subset so CI finishes in minutes, not hours,
      # while still catching dialect/migration issues on a real Postgres server.
      - name: Run PostgreSQL compatibility tests
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: bakegrill_test
          DB_USERNAME: bakegrill
          DB_PASSWORD: secret
          APP_ENV: testing
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          php artisan test --testsuite=Contract --stop-on-failure
          php artisan test \
            tests/Feature/Auth \
            tests/Feature/Tables \
            tests/Feature/System/SystemHealthDetailedTest.php \
            tests/Feature/PartialPaymentTest.php \
            --stop-on-failure

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Type-check all apps
        run: |
          npx tsc --noEmit -p apps/online-order-web/tsconfig.json
          npx tsc --noEmit -p apps/admin-dashboard/tsconfig.json
          npx tsc --noEmit -p apps/pos-web/tsconfig.json
          npx tsc --noEmit -p apps/kds-web/tsconfig.json
          npx tsc --noEmit -p apps/delivery-web/tsconfig.json

      - name: Build online-order-web
        run: npm run build --workspace=apps/online-order-web

      - name: Build admin-dashboard
        run: npm run build --workspace=apps/admin-dashboard

      - name: Build pos-web
        run: npm run build --workspace=apps/pos-web

      - name: Build kds-web
        run: npm run build --workspace=apps/kds-web

      - name: Build delivery-web
        run: npm run build --workspace=apps/delivery-web

  e2e:
    name: Playwright E2E (smoke)
    runs-on: ubuntu-latest
    needs: [frontend, test]
    # E2E runs against the live test server — skip on forks (no secrets)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke E2E tests
        env:
          BASE_URL: https://test.bakeandgrill.mv
          ADMIN_PIN:    ${{ secrets.E2E_ADMIN_PIN }}
          DRIVER_PHONE: ${{ secrets.E2E_DRIVER_PHONE }}
          DRIVER_PIN:   ${{ secrets.E2E_DRIVER_PIN }}
          TEST_PHONE:   ${{ secrets.E2E_TEST_PHONE }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          # Non-blocking for test deploy visibility; production uses e2e-gate below.
          npx playwright test \
            --project=chromium \
            --grep "@smoke|public-pages|admin-auth|apps-smoke" \
            --reporter=github \
            --timeout=30000 \
            || true

  e2e-gate:
    name: Playwright E2E (production gate)
    runs-on: ubuntu-latest
    needs: [frontend, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke E2E tests (blocking)
        env:
          BASE_URL: https://test.bakeandgrill.mv
          ADMIN_PIN:    ${{ secrets.E2E_ADMIN_PIN }}
          DRIVER_PHONE: ${{ secrets.E2E_DRIVER_PHONE }}
          DRIVER_PIN:   ${{ secrets.E2E_DRIVER_PIN }}
          TEST_PHONE:   ${{ secrets.E2E_TEST_PHONE }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          npx playwright test \
            --project=chromium \
            --grep "@smoke|public-pages|admin-auth|apps-smoke" \
            --reporter=github \
            --timeout=30000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/report/
          retention-days: 7

  deploy:
    name: Deploy (test — test.bakeandgrill.mv)
    runs-on: ubuntu-latest
    needs: [frontend, test, test-postgres, contract]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/bakeandgrill/test.bakeandgrill.mv \
            && git pull origin main \
            && cd backend \
            && composer install --no-dev --optimize-autoloader \
            && php artisan migrate --force \
            && php artisan storage:link --force \
            && php artisan config:cache \
            && php artisan route:cache \
            && php artisan view:clear \
            && php artisan queue:restart \
            && (pgrep -f "queue:work.*test.bakeandgrill" >/dev/null || cd /home/bakeandgrill/test.bakeandgrill.mv/backend && nohup php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 >> storage/logs/queue-worker.log 2>&1 &) \
            && pgrep -af "artisan queue:work" | grep test.bakeandgrill || echo "WARN: test queue worker not running" \
            && echo "Test deploy complete."

      - name: Post-deploy smoke (test)
        if: steps.deploy.outcome == 'success'
        run: ./scripts/post-deploy-smoke.sh test

      - name: Deploy skipped or failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::notice::Test deploy skipped or failed. Configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets to enable auto-deploy."

  deploy-production:
    name: Deploy (production — bakeandgrill.mv)
    runs-on: ubuntu-latest
    needs: [frontend, test, test-postgres, contract, e2e-gate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.DEPLOY_USER_PROD }}
          key: ${{ secrets.DEPLOY_SSH_KEY_PROD }}
          script: |
            cd /home/bakeandgrill/public_html \
            && git pull origin main \
            && cd backend \
            && composer install --no-dev --optimize-autoloader \
            && php artisan migrate --force \
            && php artisan storage:link --force \
            && php artisan config:cache \
            && php artisan route:cache \
            && php artisan view:clear \
            && php artisan queue:restart \
            && (pgrep -f "queue:work.*public_html" >/dev/null || cd /home/bakeandgrill/public_html/backend && nohup php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 >> storage/logs/queue-worker.log 2>&1 &) \
            && pgrep -af "artisan queue:work" | grep public_html || echo "WARN: production queue worker not running" \
            && echo "Production deploy complete."

      - name: Post-deploy smoke (production)
        if: steps.deploy.outcome == 'success'
        run: ./scripts/post-deploy-smoke.sh production

      - name: Deploy skipped or failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::notice::Production deploy skipped or failed. Configure DEPLOY_HOST_PROD, DEPLOY_USER_PROD, and DEPLOY_SSH_KEY_PROD secrets."

  contract:
    name: API contract tests (snapshot)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run contract tests
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          UPDATE_SNAPSHOTS: "false"
        run: php artisan test --testsuite=Contract --stop-on-failure
