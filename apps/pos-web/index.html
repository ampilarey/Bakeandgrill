<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/pos/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pos/favicon-32.png" />
    <link rel="apple-touch-icon" href="/pos/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://*.ingest.sentry.io; worker-src 'self';" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/dhivehi-font.css?app=website" />

    <!-- PWA manifest — lets cashiers add the POS to the home screen
         and launch it in standalone (no browser chrome). The /pos/
         scope keeps the install separate from the customer order app
         (which lives under /order/). -->
    <link rel="manifest" href="/pos/manifest.webmanifest" />
    <!-- On an iPhone home-screen app this is the status bar's colour.
         White, to run into the white top bar below it (the manifest keeps
         the rust for Android's toolbar). -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- iOS standalone hints. Without these the home-screen icon
         opens in a basic Safari shell with the URL bar at the top,
         which makes the cashier think the install "didn't work". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent" (owner, 2026-10-03: "there is a
         frost on the top of the POS, half clear"). Translucent put the page
         underneath the status bar, and the newer iOS lays a soft frost over
         anything that scrolls under it, so the menu button, title and
         shortcuts sat in the blur. With "default" the page starts below the
         status bar and nothing of ours is under the frost. iOS reads this
         when the app is added to the Home Screen, so an already-installed
         POS must be removed and added again to pick it up. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="B&G POS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Bake & Grill - POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
