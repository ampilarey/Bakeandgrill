# Gitleaks configuration for Bake & Grill
# Scans commits for accidentally committed secrets.
# Docs: https://github.com/gitleaks/gitleaks

title = "Bake & Grill Gitleaks Config"

[extend]
# Use the official default ruleset as a base, then add our overrides below.
useDefault = true

# ── Allowlist ─────────────────────────────────────────────────────────────────
# One legacy [allowlist] block, on purpose (2026-10-21). CI runs gitleaks 8.24.3
# (gitleaks-action v2's default), whose config reader has no global [[allowlists]]
# at all: such entries are unknown keys and are dropped without a word, so the
# [[allowlists]] entries this file carried never suppressed anything and only this
# block did. Gitleaks 8.30 still loads a lone [allowlist] (deprecated) but refuses
# one beside [[allowlists]], so this shape is the one that works on both. Checked
# with both binaries on the poster-template merge: the old file flagged 68 theme
# keys in index.json under 8.24.3, this one flags nothing under either.
#
# Paths and regexes are OR'ed and global, so nothing here may describe a real
# secret. Keep the list minimal, each entry with its reason.
[allowlist]
description = "Known-safe patterns: placeholders, example IPs, empty keys, test fixtures, and asset folders that can hold no credential"
# The regexes read the whole line, not just the captured secret, so the
# line-shaped ones (idempotency_key => '…', STRIPE_X=) can match as written.
regexTarget = "line"
paths = [
    # TEST_AUTO_DEPLOY.md's webhook curl examples use placeholders, not live credentials.
    '''docs/TEST_AUTO_DEPLOY\.md''',
    # Poster template assets: theme keys such as "bg042-…" in index.json are design
    # names; generic-api-key matched 68 of them on the merge of 2026-10-21.
    '''(^|/)backend/resources/poster-themes/''',
    # PHPUnit fixtures use opaque idempotency and token strings that are not credentials.
    '''(^|/)backend/tests/''',
]
regexes = [
    # CHANGE_ME placeholder tokens in .env.example are intentional documentation.
    'CHANGE_ME_[A-Z0-9_]+',
    # Idempotency keys typed into fixtures.
    '''idempotency_key['\"]?\s*=>\s*['\"][^'\"]+['\"]''',
    # Example printer IPs in documentation are illustrative, not real infrastructure.
    '192\.168\.\d+\.\d+',
    '10\.\d+\.\d+\.\d+',
    # Empty placeholders in .env.example. A filled APP_KEY=base64:… is not allowlisted:
    # the old entry for it was never in force (see above), and one in a committed
    # file should be caught.
    'APP_KEY=$',
    'STRIPE_[A-Z_]+=\s*$',
    'XERO_[A-Z_]+=\s*$',
    # AppleProvider::privateKey() wraps the key read from .env in the PEM header and
    # footer on one source line, which the private-key rule reads as a key. The regex
    # is that PHP line, not a key.
    '''BEGIN PRIVATE KEY-----\\n" \. chunk_split\(''',
]
